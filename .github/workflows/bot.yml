name: N11 Fiyat Takip

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-bot]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodları İndir
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --- VERİTABANI ÖNBELLEKLEME ---
      - name: Veritabanını Önbellekten Geri Yükle
        uses: actions/cache@v4
        with:
          path: bot_data.db
          key: n11-db-cache-${{ github.run_id }}
          restore-keys: |
            n11-db-cache-
      # -------------------------------

      - name: Botu Çalıştır
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
