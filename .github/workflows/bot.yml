name: N11 Fiyat Takip

on:
  schedule:
    - cron: '0 * * * *' # Her saat başı güvenli çalışma
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodları İndir
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bağımlılıkları Yükle
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 python-telegram-bot

      # --- İŞTE SİHİRLİ VE TEMİZ KISIM BURASI ---
      - name: Veritabanını Önbellekten Geri Yükle
        uses: actions/cache@v4
        with:
          path: bot_data.db
          key: n11-db-cache-${{ github.run_id }}
          restore-keys: |
            n11-db-cache-
      # ------------------------------------------

      - name: Botu Çalıştır
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
